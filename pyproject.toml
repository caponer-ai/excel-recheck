[project]
name = "excel-recheck"
version = "0.1.0"
description = "Незалежний перерахунок підсумків Excel-звіту: що зійшлось, що не перевірено, звідки числа"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кирилиця в рядках і коментарях це навмисно
